[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "e7shop"
version = "0.1.0"
description = "Epic Seven Secret Shop helper: buys Covenant Bookmarks and Mystic Medals and refreshes the shop."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    "mss>=9.0",
    "PySide6>=6.7",
    "psutil>=5.9; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "keyboard>=0.13.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
e7shop = "e7shop.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/e7shop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
